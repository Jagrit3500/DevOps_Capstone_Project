name: HireFlow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v --tb=short

  build-frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  images:
    name: Build, scan and publish images
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/hireflow-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/hireflow-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        run: docker build -t "${{ steps.images.outputs.backend }}:${GITHUB_SHA}" ./backend
      - name: Build frontend image
        run: docker build -t "${{ steps.images.outputs.frontend }}:${GITHUB_SHA}" ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backend }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Publish scanned images
        run: |
          docker push "${{ steps.images.outputs.backend }}:${GITHUB_SHA}"
          docker push "${{ steps.images.outputs.frontend }}:${GITHUB_SHA}"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: images
    if: vars.EKS_CLUSTER_NAME != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"
      - uses: azure/setup-helm@v4
      - name: Set lowercase registry
        id: registry
        shell: bash
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Deploy HireFlow
        run: |
          helm upgrade --install hireflow ./helm/hireflow \
            --namespace hireflow --create-namespace \
            --set-string registry="${{ steps.registry.outputs.value }}" \
            --set-string backend.tag="${GITHUB_SHA}" \
            --set-string frontend.tag="${GITHUB_SHA}" \
            --wait --timeout 10m
