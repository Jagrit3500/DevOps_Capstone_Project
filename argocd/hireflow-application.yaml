apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hireflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jagrit3500/DevOps_Capstone_Project.git
    targetRevision: main
    path: helm/hireflow
    helm:
      releaseName: hireflow
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hireflow
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
