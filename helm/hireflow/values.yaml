replicaCount: 2

registry: ghcr.io/YOUR_GITHUB_USERNAME
imagePullSecrets: []

backend:
  image: hireflow-backend
  tag: latest
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image: hireflow-frontend
  tag: latest
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  image: postgres:16-alpine
  user: hireflow
  database: hireflow
  existingSecret: hireflow-db
  port: 5432
  storage: 5Gi
  storageClassName: hireflow-gp3

ingress:
  enabled: true
  className: nginx
  host: ""
  annotations: {}

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: hireflow

namespace: hireflow
