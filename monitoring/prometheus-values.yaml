# Prometheus Helm values for HireFlow monitoring
# Install: helm upgrade --install prometheus prometheus-community/prometheus \
#   -n monitoring --create-namespace -f monitoring/prometheus-values.yaml

server:
  persistentVolume:
    enabled: true
    size: 8Gi
    storageClass: hireflow-gp3

  retention: "15d"

  global:
    scrape_interval: 15s
    evaluation_interval: 15s

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

scrapeConfigs:
  hireflow-backend:
    job_name: hireflow-backend
    static_configs:
      - targets:
          - backend.hireflow.svc.cluster.local:8000
    metrics_path: /metrics
    scrape_interval: 15s
