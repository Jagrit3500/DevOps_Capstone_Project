apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image-demo
  namespace: hireflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image-demo
  template:
    metadata:
      labels:
        app: broken-image-demo
    spec:
      containers:
        - name: demo
          image: ghcr.io/example/this-image-does-not-exist:never
